name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs deps and runs the postinstall (copies Stockfish + downloads NNUE).
      - name: Install dependencies
        run: npm install

      # Browser for the e2e suite (with OS deps for Chromium on Linux).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install pre-commit
        run: python -m pip install pre-commit

      # Run the SAME hooks developers run on commit (eslint, stylelint, unit, e2e),
      # so CI output is synchronized with the local pre-commit experience.
      # MV3 extensions require a headed browser; xvfb provides a virtual display
      # (preinstalled on ubuntu runners) wrapping the whole hook set.
      - name: pre-commit (lint + unit + e2e)
        run: xvfb-run -a pre-commit run --all-files --show-diff-on-failure

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
